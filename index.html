<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ニコニコ サムネイルファインダー</title>
<style>
  :root {
    --bg: #f6f6f4;
    --ink: #1d1d1f;
    --sub: #6b6b70;
    --line: #dcdcd6;
    --accent: #2457c5;
    --ok: #1f7a3d;
    --ng: #a33a3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.3rem; margin: 0 0 16px; }
  h2 { font-size: 1.05rem; margin: 32px 0 12px; }
  .search { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; min-width: 0;
    padding: 10px 12px; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
  }
  button {
    padding: 10px 18px; font-size: 1rem; cursor: pointer;
    border: 0; border-radius: 6px; background: var(--accent); color: #fff;
  }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 3px solid #8fb0f5; outline-offset: 2px; }
  #status { margin: 12px 0 0; color: var(--sub); font-size: .9rem; min-height: 1.4em; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .card .imgbox { background: #e9e9e4; min-height: 100px; display: flex; align-items: center; justify-content: center; }
  .card img { display: block; width: 100%; height: auto; }
  .card .meta { padding: 10px 12px; font-size: .82rem; word-break: break-all; }
  .badge {
    display: inline-block; padding: 0 8px; margin-right: 6px; border-radius: 10px;
    font-size: .75rem; font-weight: 600; color: #fff; background: var(--sub);
  }
  .badge.q3 { background: var(--ok); }
  .badge.q2 { background: var(--accent); }
  .card a { color: var(--accent); }
  .date { color: var(--sub); }

  ul.ng { list-style: none; margin: 0; padding: 0; font-size: .8rem; color: var(--ng); }
  ul.ng li { padding: 4px 0; border-bottom: 1px solid var(--line); word-break: break-all; }
  .empty { color: var(--sub); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>ニコニコ サムネイルファインダー</h1>

  <div class="search">
    <input id="q" type="text" inputmode="text" placeholder="動画のリンク / sm46525485 / 46525485" autocomplete="off">
    <button id="go">検索</button>
  </div>
  <p id="status"></p>

  <h2>アーカイブあり <span id="okCount"></span></h2>
  <div id="found" class="grid"><p class="empty">まだ検索していません</p></div>

  <h2>アーカイブなし <span id="ngCount"></span></h2>
  <ul id="missing" class="ng"></ul>
</main>

<script>
const CDX = "https://web.archive.org/cdx/search/cdx";

// 従来のパターン(ID を {id} で置換)
function legacyPatterns(id) {
  const hosts = ["tn-skr.smilevideo.jp", "tn-skr1.smilevideo.jp", "tn-skr2.smilevideo.jp",
                 "tn-skr3.smilevideo.jp", "tn-skr4.smilevideo.jp"];
  const list = [];
  for (const h of hosts) {
    list.push(`http://${h}/smile?i=${id}`);
    list.push(`http://${h}/smile?i=${id}.L`);
  }
  list.push(`https://nicovideo.cdn.nimg.jp/thumbnails/${id}/${id}.L`);
  list.push(`https://nicovideo.cdn.nimg.jp/thumbnails/${id}/${id}`);
  list.push(`https://tn.smilevideo.jp/smile?i=${id}`);
  return list;
}

// 新パターン: thumbnails/{id}/ 以下を前方一致で検索(末尾の数字が動画ごとに違うため)
function newPatternPrefix(id) {
  return `nicovideo.cdn.nimg.jp/thumbnails/${id}/`;
}

function quality(url) {
  if (/\.L$/.test(url)) return 3;
  if (/\.M$/.test(url)) return 2;
  return 1;
}
const qLabel = { 3: "L(高画質)", 2: "M(中画質)", 1: "無印(低画質)" };

function tsToDate(ts) {
  return `${ts.slice(0,4)}/${ts.slice(4,6)}/${ts.slice(6,8)}`;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

// タイムアウト+リトライ付き fetch(429/5xx/通信失敗のとき再試行)
async function fetchRetry(url, tries = 3) {
  let lastErr;
  for (let n = 0; n < tries; n++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 20000);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      clearTimeout(timer);
      if (res.status === 429 || res.status >= 500) {
        lastErr = new Error(`HTTP ${res.status}`);
        await sleep(700 * (n + 1));
        continue;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res;
    } catch (e) {
      clearTimeout(timer);
      lastErr = e.name === "AbortError" ? new Error("タイムアウト") : e;
      if (/^HTTP 4/.test(lastErr.message)) throw lastErr; // 429以外の4xxは再試行しない
      await sleep(700 * (n + 1));
    }
  }
  throw lastErr;
}

async function cdx(params) {
  const qs = new URLSearchParams({
    output: "json",
    fl: "timestamp,original,mimetype",
    filter: "statuscode:200",
    ...params
  });
  const res = await fetchRetry(`${CDX}?${qs}`);
  const text = await res.text();
  if (!text.trim()) return [];
  const rows = JSON.parse(text);
  return rows.slice(1).map(([timestamp, original, mimetype]) => ({ timestamp, original, mimetype }));
}

// CDXが使えないときの予備(完全一致のみ)。availability API
async function availability(url) {
  const res = await fetchRetry(`https://archive.org/wayback/available?url=${encodeURIComponent(url)}`);
  const json = await res.json();
  const c = json.archived_snapshots && json.archived_snapshots.closest;
  if (c && c.available && String(c.status) === "200") {
    return [{ timestamp: c.timestamp, original: url, mimetype: "" }];
  }
  return [];
}

// 各 original URL につき最新のキャプチャだけ残す
function latestPerUrl(rows) {
  const map = new Map();
  for (const r of rows) {
    const cur = map.get(r.original);
    if (!cur || r.timestamp > cur.timestamp) map.set(r.original, r);
  }
  return [...map.values()];
}

async function pool(tasks, limit) {
  const results = new Array(tasks.length);
  let i = 0;
  async function worker() {
    while (i < tasks.length) {
      const idx = i++;
      results[idx] = await tasks[idx]();
    }
  }
  await Promise.all(Array.from({ length: limit }, worker));
  return results;
}

// リンク・smコード・数字のどれでもIDを取り出す
// 例: https://www.nicovideo.jp/watch/sm46525485 / nico.ms/sm46525485 /
//     ext.nicovideo.jp/thumb/sm46525485 / sm46525485 / 46525485 /
//     .../thumbnails/46525485/46525485.62851576.L / ...smile?i=46525485.L
function extractId(input) {
  const s = input.trim();
  const patterns = [
    /(?:sm|nm|so)(\d+)/i,
    /[?&]i=(\d+)/,
    /thumbnails\/(\d+)/,
    /(\d+)/
  ];
  for (const p of patterns) {
    const m = s.match(p);
    if (m) return m[1];
  }
  return null;
}

async function search() {
  const id = extractId(document.getElementById("q").value);
  const status = document.getElementById("status");
  const foundEl = document.getElementById("found");
  const missingEl = document.getElementById("missing");
  const btn = document.getElementById("go");

  if (!id) {
    status.textContent = "sm番号または数字を入力してください。";
    return;
  }

  btn.disabled = true;
  foundEl.innerHTML = "";
  missingEl.innerHTML = "";
  document.getElementById("okCount").textContent = "";
  document.getElementById("ngCount").textContent = "";

  const legacy = legacyPatterns(id);
  const tasks = [];

  // 従来パターン(完全一致)
  for (const url of legacy) {
    tasks.push(async () => {
      try {
        const rows = await cdx({ url });
        return { kind: "exact", url, rows };
      } catch (e1) {
        try {
          const rows = await availability(url);
          return { kind: "exact", url, rows };
        } catch (e2) {
          return { kind: "exact", url, rows: [], error: e1.message };
        }
      }
    });
  }
  // 新パターン(前方一致)
  const prefix = newPatternPrefix(id);
  tasks.push(async () => {
    try {
      const rows = await cdx({ url: prefix, matchType: "prefix", limit: "500" });
      return { kind: "prefix", url: prefix + "*", rows };
    } catch (e) {
      return { kind: "prefix", url: prefix + "*", rows: [], error: e.message };
    }
  });

  let done = 0;
  status.textContent = `検索中… 0 / ${tasks.length}`;
  const wrapped = tasks.map(t => async () => {
    const r = await t();
    done++;
    status.textContent = `検索中… ${done} / ${tasks.length}`;
    return r;
  });

  const results = await pool(wrapped, 7);

  const found = new Map(); // original -> row
  const missing = [];
  let errors = 0;

  for (const r of results) {
    if (r.error) errors++;
    const rows = latestPerUrl(r.rows.filter(x => !x.mimetype || x.mimetype.startsWith("image/")));
    if (rows.length === 0) {
      missing.push(r.url + (r.error ? `(取得エラー: ${r.error})` : ""));
    } else {
      for (const row of rows) found.set(row.original, row);
    }
  }

  // 高画質順に並べる
  const items = [...found.values()].sort((a, b) =>
    quality(b.original) - quality(a.original) || b.timestamp.localeCompare(a.timestamp));

  if (items.length === 0) {
    foundEl.innerHTML = '<p class="empty">アーカイブされた画像は見つかりませんでした。</p>';
  }
  for (const it of items) {
    const q = quality(it.original);
    const raw = `https://web.archive.org/web/${it.timestamp}im_/${it.original}`;
    const page = `https://web.archive.org/web/${it.timestamp}/${it.original}`;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="imgbox"><a href="${raw}" target="_blank" rel="noopener"><img loading="lazy" alt=""></a></div>
      <div class="meta">
        <span class="badge q${q}">${qLabel[q]}</span><span class="date">${tsToDate(it.timestamp)}</span><br>
        <a href="${page}" target="_blank" rel="noopener"></a>
      </div>`;
    card.querySelector("img").src = raw;
    const a = card.querySelector(".meta a");
    a.textContent = it.original;
    foundEl.appendChild(card);
  }

  for (const m of missing) {
    const li = document.createElement("li");
    li.textContent = m;
    missingEl.appendChild(li);
  }

  document.getElementById("okCount").textContent = `(${items.length}件)`;
  document.getElementById("ngCount").textContent = `(${missing.length}件)`;
  const firstErr = results.find(r => r.error);
  status.textContent = errors
    ? `ID ${id}:完了(${errors}件の取得エラー: ${firstErr.error})。全件エラーの場合は、ファイルアプリのプレビューではなくSafariなどのブラウザで開くか、Webに置いて開いてください。`
    : `ID ${id}:完了`;
  btn.disabled = false;
}

document.getElementById("go").addEventListener("click", search);
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") search(); });
</script>
</body>
</html>
